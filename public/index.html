    <style>
      html.is-booting { overflow: hidden; }
      html.is-booting #hero *:not(.hero-scroll) { animation-play-state: paused !important; }
      #boot { position: fixed; inset: 0; z-index: 9999; background: #0b0b0b; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; font-family: "Helvetica Neue", Arial, sans-serif; transition: transform .9s cubic-bezier(.76,0,.24,1), opacity .5s ease .45s; will-change: transform; }
      #boot::before { content: ""; position: absolute; inset: 0; background: radial-gradient(60% 45% at 50% 42%, rgba(229,9,20,.16), transparent 70%); animation: bGlow 2.6s ease-in-out infinite alternate; }
      #boot::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: #E50914; transform-origin: left; transform: scaleX(var(--p, 0)); transition: transform .35s ease; box-shadow: 0 0 18px rgba(229,9,20,.8); }
      #boot.b-out { transform: translateY(-100%); }
      #boot .b-mark { position: relative; width: 76px; height: 76px; border-radius: 18px; overflow: hidden; border: 1px solid rgba(229,9,20,.55); box-shadow: 0 0 0 6px rgba(229,9,20,.08), 0 18px 50px -12px rgba(229,9,20,.55); animation: bFloat 2.4s ease-in-out infinite; }
      #boot .b-mark img { width: 100%; height: 100%; display: block; object-fit: cover; }
      #boot .b-word { position: relative; display: flex; gap: .42em; font-weight: 900; font-size: 22px; letter-spacing: .02em; }
      #boot .b-word span { opacity: 0; transform: translateY(10px); animation: bIn .6s cubic-bezier(.22,1,.36,1) forwards; }
      #boot .b-sub { position: relative; margin-top: -14px; font-size: 10px; font-weight: 800; letter-spacing: .5em; color: #E50914; opacity: 0; animation: bIn .6s .55s forwards; }
      #boot .b-pct { position: relative; font-size: 12px; font-weight: 700; color: rgba(255,255,255,.45); font-variant-numeric: tabular-nums; letter-spacing: .08em; min-width: 4ch; text-align: center; }
      @keyframes bIn { to { opacity: 1; transform: none; } }
      @keyframes bFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
      @keyframes bGlow { from { opacity: .55; } to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { #boot, #boot * , #boot::before { animation: none !important; } #boot .b-word span, #boot .b-sub { opacity: 1; transform: none; } #boot.b-out { transform: none; opacity: 0; } }

    <script>
      (function () {
        var el = document.getElementById('boot');
        var html = document.documentElement;
        if (!el) return;
        if (/^\/admin\/?$/.test(location.pathname)) { el.parentNode.removeChild(el); return; }
        html.classList.add('is-booting');
        var seen = false;
        try { seen = sessionStorage.getItem('esh-boot') === '1'; } catch (e) {}
        // Phase 1 "boot":  the first screen — app, fonts, hero cover and headline.
        // Phase 2 "warm":  the partner logos, the poster strip and the first portfolio covers,
        //                  downloaded AND decoded, so the first thing people scroll to opens smoothly.
        // Phase 3 "warm2": every other image further down the page (first visit only).
        var MIN = seen ? 0 : 1400, CRIT = seen ? 1500 : 7000, REST = seen ? 0 : 2500, MAX = 16000, t0 = Date.now();
        var weights = { app: 40, fonts: 15, cover: 30, headline: 15 }, got = {};
        var phase = 'boot', warmAt = 0, restAt = 0, shown = 0, finished = false;
        var crit = { e: 0, l: 0 }, rest = { e: 0, l: 0 };
        var pct = el.querySelector('.b-pct');
        function fire(name) { try { window.dispatchEvent(new Event(name)); } catch (e) {} }
        function real() { var p = 0; for (var k in got) p += weights[k] || 0; return p; }
        function target(now) {
          if (phase === 'boot') {
            var r = real() * 0.7;
            return Math.min(69, r + (69 - r) * (1 - Math.exp(-(now - t0) / 3500)));
          }
          if (phase === 'warm') {
            var f = crit.e ? Math.min(1, crit.l / crit.e) : 0;
            return Math.min(94, Math.max(70 + 24 * f, 70 + 22 * Math.min(1, (now - warmAt) / CRIT)));
          }
          var g = rest.e ? Math.min(1, rest.l / rest.e) : 1;
          return Math.min(99, Math.max(94 + 5 * g, 94 + 5 * Math.min(1, (now - restAt) / REST)));
        }
        function frame() {
          if (finished) return;
          var now = Date.now();
          if (phase === 'boot' && real() >= 100 && now - t0 >= MIN) {
            phase = 'warm'; warmAt = now;
            fire('eshelon:warm');
          }
          if (phase === 'warm' && ((now - warmAt > 350 && crit.l >= crit.e) || now - warmAt >= CRIT)) {
            if (!REST) return finish();
            phase = 'warm2'; restAt = now;
            fire('eshelon:warm2');
          }
          if (phase === 'warm2' && ((now - restAt > 350 && rest.l >= rest.e) || now - restAt >= REST)) return finish();
          shown = Math.max(shown, shown + (target(now) - shown) * 0.12); // never goes backwards
          paint(shown);
          requestAnimationFrame(frame);
        }
        function paint(v) { el.style.setProperty('--p', (v / 100).toFixed(3)); pct.textContent = Math.round(v) + '%'; }
        function finish() {
          if (finished) return;
          finished = true;
          paint(100);
          setTimeout(function () {
            el.classList.add('b-out');
            html.classList.remove('is-booting');
            try { sessionStorage.setItem('esh-boot', '1'); } catch (e) {}
            fire('eshelon:ready');
            setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 1000);
          }, 220);
        }
        window.__boot = {
          mark: function (k) { if (!got[k]) got[k] = Date.now() - t0; },
          got: got,
          expect: function (isCritical) { (isCritical ? crit : rest).e += 1; },
          loaded: function (isCritical) { (isCritical ? crit : rest).l += 1; },
          get phase() { return finished ? 'ready' : phase; },
          get stats() { return { phase: finished ? 'ready' : phase, critical: crit.l + '/' + crit.e, rest: rest.l + '/' + rest.e, ms: Date.now() - t0 }; },
          done: finish,
          get ready() { return finished; }
        };
        setTimeout(finish, MAX);
        requestAnimationFrame(frame);
      })();
    </script>
